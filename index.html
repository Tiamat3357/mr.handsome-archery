<!DOCTYPE html>
<html lang="th" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MR. HANDSOME ARCHERY</title>

    <!-- 🔤 Google Fonts & Material Symbols (แก้ปัญหาไอคอนกลายเป็นตัวหนังสือ) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Prompt:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />

    <!-- 🎨 โหลด Tailwind CDN พร้อมชุดสีและสไตล์ของหน้าลูกค้า -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#ffd700",
              "primary-container": "#ffd700",
              "on-primary": "#1a1a1a",
              "on-primary-container": "#5c4a00",
              surface: "#121212",
              "on-surface": "#f5f5f0",
              "surface-variant": "#2c2c2c",
              "on-surface-variant": "#bfbfbb",
              "surface-container": "#262626",
              "surface-container-low": "#1c1c1c",
              "surface-container-lowest": "#181818",
              "surface-container-high": "#2e2e2e",
              "surface-container-highest": "#343434",
              secondary: "#181818",
              "on-secondary": "#f5f5f0",
              "inverse-surface": "#181818",
              "inverse-on-surface": "#f5f5f0",
              "outline-variant": "#383838",
              outline: "#5a5a5a",
              "tactical-mustard": "#ffd700",
              "tactical-charcoal": "#121212"
            },
            fontFamily: {
              sans: ["'Be Vietnam Pro'", "Prompt", "sans-serif"]
            }
          }
        }
      }
    </script>

    <!-- 📱 PWA / Standalone Display -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#121212" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body class="bg-[#121212] text-[#f5f5f0] antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
